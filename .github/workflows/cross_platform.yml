name: deploy.py cross-platform

# Smoke test : valide que deploy.py (Python pur, stdlib seule) tourne sur
# Ubuntu et macOS aussi bien que sur Windows.
#
# Le test execute :
#   1. python3 deploy.py --help     (argparse + UTF-8 reconfigure + imports)
#   2. python3 deploy.py -m ... --dry-run
#      = contrôles du dépôt (branche main, remote officiel, HEAD égal à
#        origin/main, aucun fichier nouveau non suivi), puis diff sur le
#        checkout lui-même, vide. Le but est de valider qu'aucune erreur
#        OS-spécifique (encodage, ctypes Windows-only, etc.) ne casse
#        l'exécution.
#
# --dry-run sort AVANT tout commit/push et ne touche pas à l'index : aucun
# risque pour main.

on:
  push:
    branches: [main]
    paths:
      - 'deploy.py'
      - '.github/workflows/cross_platform.yml'
  workflow_dispatch:

# Droits minimaux du GITHUB_TOKEN : lecture seule. Un job qui publie
# déclare lui-même le droit d'écriture dont il a besoin.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: python3 --version
        run: python3 --version

      - name: deploy.py --help
        run: python3 deploy.py --help

      - name: deploy.py --dry-run (contrôles du dépôt + diff, sort avant commit)
        run: python3 deploy.py -m "ci dry-run cross-platform" --dry-run
